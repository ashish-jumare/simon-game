<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Simon Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>Simon Game</h1>

        <div class="level">
            Level: <span id="level">0</span>
        </div>

        <div class="score-board">
            <div class="score-card">
                <span class="score-label" id="scoreLabel">Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="score-card best-score-card">
                <span class="score-label">Best</span>
                <strong id="bestScore">0</strong>
            </div>
        </div>

        <div class="board">

            <button
                class="pad green"
                id="green"
                data-color="green"
                aria-label="Green"
            ></button>

            <button
                class="pad red"
                id="red"
                data-color="red"
                aria-label="Red"
            ></button>

            <button
                class="pad yellow"
                id="yellow"
                data-color="yellow"
                aria-label="Yellow"
            ></button>

            <button
                class="pad blue"
                id="blue"
                data-color="blue"
                aria-label="Blue"
            ></button>

        </div>

        <p id="message">
            Press Start Game
        </p>

        <button
            id="startButton"
            class="start-button"
        >
            Start Game
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
